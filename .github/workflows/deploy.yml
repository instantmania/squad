# Bangun + terbitkan situs ke GitHub Pages.
# Setiap kali ada push ke main (termasuk simpanan dari panel admin), halaman Matchday
# dibuat otomatis dari artikel di content/matchday/*.md, lalu seluruh situs diterbitkan.
#
# PENTING: di GitHub → Settings → Pages → "Build and deployment" → Source
#          pilih "GitHub Actions" (bukan "Deploy from a branch").

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang pustaka
        run: pip install pyyaml markdown

      
      - name: Salin situs ke folder _site (tanpa file internal)
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='scripts' \
            --exclude='content' \
            --exclude='node_modules' \
            ./ _site/

      - name: Salin aset foto Matchday
        run: |
          if [ -d content/matchday/assets/matchday ]; then
            mkdir -p _site/assets/matchday
            rsync -a \
              content/matchday/assets/matchday/ \
              _site/assets/matchday/
          else
            echo "Folder aset Matchday belum tersedia."
          fi

      - name: Buat halaman Matchday dari artikel panel admin
        run: |
          python scripts/build_matchday.py \
            --content content/matchday \
            --site _site \
            --site-url https://instantmania.github.io/squad


      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
